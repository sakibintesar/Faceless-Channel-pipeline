name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install edge-tts requests pytest pytest-cov ruff black mypy
      
      - name: Run Ruff (lint)
        run: ruff check pipeline/
      
      - name: Run Black (format check)
        run: black --check pipeline/
      
      - name: Run MyPy (type check)
        run: mypy pipeline/ --ignore-missing-imports
      
      - name: Run Tests
        run: |
          pytest -v --cov=pipeline --cov-report=term-missing --cov-report=xml
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        if: github.repository_owner == 'sakibintesar'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Test the render workflow syntax
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow files
        run: |
          for f in .github/workflows/*.yml; do
            echo "Checking $f..."
            python -c "import yaml; yaml.safe_load(open(f))" && echo "  ✓ Valid YAML"
          done